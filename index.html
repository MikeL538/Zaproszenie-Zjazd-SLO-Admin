<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaproszenie-Zjazd-SLO-Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="form">
      <div id="form__container">
        <div>
          <p>E-mail</p>
          <input id="email" type="text" />
          <p>Hasło</p>
          <input id="password" type="password" />
        </div>
        <div class="buttons__container">
          <button type="submit" id="buttonShowList">
            Zaloguj i pokaż liste
          </button>
          <button type="button" id="buttonSignOut">Bezpiecznie wyloguj</button>
          <button type="button" id="buttonBackup">Kopia danych BACKUP</button>
        </div>
      </div>
    </form>

    <form>
      <div id="div__search">
        <div>
          <p id="amountFound">Znaleziono: 0</p>
          <p id="paidFound">Opłaconych: 0</p>
        </div>
        <div>
          <div>
            <p>Sortuj po</p>
            <select id="selectSort">
              <option value="1">Nazwisku</option>
              <option value="2">Roku ukończenia</option>
              <option value="3">Opłaconych</option>
              <option value="4">Nieopłaconych</option>
            </select>
          </div>

          <div>
            <p>Wyszukaj:</p>
            <input id="search" type="text" />
          </div>
        </div>
      </div>
    </form>
    <table id="table"></table>
    <script type="module" src="script.js"></script>
  </body>
</html>
